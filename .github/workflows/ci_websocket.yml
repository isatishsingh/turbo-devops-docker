name: CI - Websocket Server
on:
  push: 
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the code
        uses: actions/checkout@v2

      - name: Docker Login
        uses: docker/login-action@v2
        with:
          username: ${{ secret.DOCKERHUB_USERNAME }}
          password: ${{ secret.DOCKERHUB_PASSWORD }}
      
      - name: Docker Build and Push
        uses: docker/buid-push-action@v4
        with:
          context: .
          build-args:
            - DATABASE_URL=${{ secrets.ENVIRONMENT_VARIABLE }}
          file: ./docker/Dockerfile.ws
          push: true
          tags: mendcatdocker/user-app-ws:${{ github.sha}}
