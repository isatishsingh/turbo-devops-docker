name: CI - Websocket Server
on:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the code
        uses: actions/checkout@v2

      - name: Docker Login
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Docker Build and Push
        uses: docker/buid-push-action@v4
        with:
          context: .
          file: ./docker/Dockerfile.ws
          build-args:
            - DATABASE_URL=${{ secrets.ENVIRONMENT_VARIABLE }}
          push: true
          tags: mendcatdocker/user-app-ws:${{ github.sha}}
